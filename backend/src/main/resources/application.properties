# Spring Boot application properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.error.include-message=always
server.port=8080

twilio.accountSid = ${ACCOUNT_SID}
twilio.authToken= ${AUTH_TOKEN}
twilio.verifyServiceSid= ${SERVICE_SID}

logging.level.root= INFO
logging.level.com.twilio = DEBUG
logging.level.org.springframework.web = INFO

# Here API
here.api.key = ${HERE_API_KEY}
here.api.route-url = https://router.hereapi.com/v8/routes
here.api.search-url = https://discover.search.hereapi.com/v1/discover

#JWT
jwt.secret = ${JWT_SECRET}
#for 30 days
jwt.refreshExpirationMs = 2592000000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
